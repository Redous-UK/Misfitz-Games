<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Misfitz Games — Play</title>

    <link rel="stylesheet" href="/styles/play.css" />
</head>
<body>
    <div class="play-shell">
        <header class="play-topbar">
            <div>
                <h1>Misfitz Games</h1>
                <p id="roomLine">Room not joined</p>
            </div>

            <div class="play-actions">
                <input id="roomRef" placeholder="Room code" />
                <button id="btnJoin" type="button">Join</button>
                <button id="btnLeave" type="button" disabled>Leave</button>
                <a id="overlayLink" href="#" target="_blank">Overlay</a>
            </div>
        </header>

        <section class="status-row">
            <span id="statusBadge">Loading...</span>
            <span id="gameBadge">No game</span>
        </section>

        <main class="play-grid">
            <aside class="game-menu">
                <h2>Games</h2>

                <button type="button" data-game="contexto">Contexto</button>
                <button type="button" data-game="trivia">Trivia</button>
                <button type="button" data-game="hangman">Hangman</button>
                <button type="button" data-game="higherlower">Higher or Lower</button>
                <button type="button" data-game="riddle_me_this">Riddle Me This</button>
                <button type="button" data-game="deal">Deal or No Deal</button>
            </aside>

            <section class="game-stage">
                <div id="gamePanels">
                    <div id="panel-loading" class="game-panel" hidden>
                        <h2>Loading game panels...</h2>
                    </div>
                </div>
            </section>

            <aside class="side-panel">
                <section class="card">
                    <h2>Stats</h2>
                    <pre id="statsOut">No stats yet.</pre>
                </section>

                <section class="card">
                    <h2>Leaderboard</h2>
                    <div id="leaderboardOut">No leaderboard yet.</div>
                </section>
            </aside>
        </main>
    </div>

    <script type="module" src="/js/app/playApp.js"></script>
</body>
</html>
