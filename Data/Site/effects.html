<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Misfitz Effects</title>
    <link rel="stylesheet" href="/site.css" />
</head>
<body>
    <div class="wrap">
        <div class="titleRow">
            <h1>Misfitz Effects</h1>
            <div class="row" style="gap:8px; align-items:center;">
                <span id="tuyaBadge" class="badge warn">Tuya: checking…</span>
                <a class="btn" href="/user.html">Back</a>
            </div>
        </div>

        <div class="effectsGrid">
            <!-- LEFT: effects list -->
            <div class="card">
                <div class="row" style="justify-content:space-between; align-items:center;">
                    <div class="sectionTitle">EFFECTS</div>
                    <button id="btnNewEffect" class="btn">+ New</button>
                </div>

                <div class="row" style="gap:8px; margin-top:8px;">
                    <input id="newEffectName" class="grow" placeholder="Effect name (e.g., Hype Lights)" />
                    <select id="newEffectAction">
                        <option value="1">Pulse Switch</option>
                        <option value="2">Switch On</option>
                        <option value="3">Switch Off</option>
                    </select>
                </div>

                <div class="row" style="gap:8px; margin-top:8px;">
                    <input id="newEffectDuration" type="number" min="1" max="30" value="2" />
                    <input id="newEffectCooldown" type="number" min="0" max="600" value="2" />
                </div>
                <div class="muted" style="margin-top:6px;">Duration (sec) • Cooldown (sec)</div>

                <div id="effectsList" class="list" style="margin-top:10px;"></div>
            </div>

            <!-- RIGHT: effect details -->
            <div class="card">
                <div class="sectionTitle">EFFECT DETAILS</div>
                <div id="effectMeta" class="muted" style="margin-top:6px;">Select an effect…</div>

                <div class="hr"></div>

                <div class="row" style="justify-content:space-between; align-items:center;">
                    <div class="sectionTitle">TARGETS</div>
                    <button id="btnRun" class="btn primary" disabled>RUN</button>
                </div>

                <div id="targetsList" class="list" style="margin-top:10px;"></div>

                <div class="hr"></div>

                <div class="sectionTitle">ADD TARGET</div>
                <div class="row" style="gap:8px; margin-top:8px;">
                    <select id="targetType">
                        <option value="1">Device</option>
                        <option value="2">Group</option>
                    </select>
                    <select id="targetPicker" class="grow"></select>
                </div>

                <div class="row" style="gap:8px; margin-top:8px;">
                    <input id="targetDurationOverride" type="number" min="1" max="30" placeholder="Override secs (optional)" />
                    <input id="targetSort" type="number" value="0" />
                    <button id="btnAddTarget" class="btn">Add</button>
                </div>

                <div class="hr"></div>

                <div class="sectionTitle">OUTPUT</div>
                <pre id="out" class="code"></pre>
            </div>
        </div>
    </div>

    <script src="/effects.js"></script>
</body>
</html>
