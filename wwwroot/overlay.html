<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Misfitz Overlay</title>
    <link rel="stylesheet" href="/overlay.css" />
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="row" style="justify-content:space-between;">
                <div class="title" id="roomTitle">Misfitz Overlay</div>
                <div class="badge" id="statusBadge">Loading…</div>
            </div>

            <div class="muted" id="subLine"></div>

            <div id="contextoBlock">
                <div class="sectionTitle">RECENT GUESSES</div>
                <ul id="guessesList"></ul>

                <div class="sectionTitle">TOP SCORES</div>
                <ul id="scoresList"></ul>
            </div>

            <div id="noGameBlock" class="muted hidden" style="margin-top:10px;">
                No active game in this room.
            </div>
        </div>
    </div>

    <script>


        async function btnStopHandler() {
            try {
                const code = roomId();
                if (!code) return alert("Pick a room first.");
                const r = await api(`/rooms/${encodeURIComponent(code)}/games/stop`, { method: "POST" });
                const gameOut = el("gameOut");
                if (gameOut) gameOut.textContent = pretty(r);
                await refreshState();
            } catch (e) {
                const gameOut = el("gameOut");
                if (gameOut) gameOut.textContent = String(e);
            }
        }


        // ---------- init ----------
        async function init() {
            // auth
            const me = await api("/member/me");
            const authOut = el("authOut");
            if (authOut) authOut.textContent = pretty(me);


            const meLabel = el("meLabel");
            if (meLabel) {
                meLabel.textContent = me.isAuth
                    ? `👤 ${me.name ?? "Signed in"} (${me.role ?? "user"})`
                    : "Not logged in";
            }


            if (!me.isAuth) {
                location.href = "/user.html";
                return;
            }


            myUserId = me.userId || null;
            applyRoleUI(me.role);


            // wire non-drawer buttons safely
            onClick("btnBack", () => (location.href = "/user.html"));


            onClick("btnLogout", async () => {
                try {
                    const r = await api("/member/logout", { method: "POST" });
                    const authOut2 = el("authOut");
                    if (authOut2) authOut2.textContent = pretty(r);
                } finally {
                    location.href = "/user.html";
                }
            });


            onClick("btnAdmin", () => (location.href = "/admin.html"));
            onClick("btnRefreshRooms", loadRooms);


            onClick("btnOpenOverlay", () => {
                const code = roomId();
                if (!code) return alert("Pick a room first.");
                window.open(`/overlay.html?roomId=${encodeURIComponent(code)}`, "_blank");
            });


            // NOTE: btnPlay/start/stop/leaderboard are handled via delegated click above


            // boot
            await loadGames();
            await loadRooms();
            autoLoadRoomFromStorage();
            startPolling();
        }


        document.addEventListener("DOMContentLoaded", () => {
            init().catch((err) => {
                console.error("Lobby init failed", err);
                location.href = "/user.html";
            });
        });
    </script>
</body>
</html>
