<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Misfitz Debug</title>
    <link rel="stylesheet" href="/site.css" />
</head>
<body>
    <div class="wrap">
        <div class="topbar">
            <h1>Debug Dashboard</h1>
            <div class="pill">/debug</div>
        </div>

        <div class="row">
            <button onclick="loadAll()">Refresh</button>
            <span id="status" class="pill">idle</span>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <script>
    const endpoints = [
      { title: "DB", path: "/debug/db" },
      { title: "DB Path", path: "/debug/dbpath" },
      { title: "Users", path: "/debug/users" },
      { title: "Environment", path: "/debug/env" },
      { title: "Who Am I", path: "/debug/whoami" },
      { title: "Redis", path: "/debug/redis" },
      { title: "Redis Details", path: "/debug/redis/details" },
    ];

    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");

    function cardTemplate(title, path) {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <h2>
          <span>${title}</span>
          <span class="actions">
            <a href="${path}" target="_blank" rel="noreferrer">Open JSON</a>
          </span>
        </h2>
        <pre id="pre-${cssSafeId(path)}">Loading…</pre>
      `;
      return div;
    }

    function cssSafeId(s) {
      return s.replace(/[^a-z0-9]/gi, "_");
    }

    async function fetchPretty(path) {
      const res = await fetch(path, { headers: { "Accept": "application/json" } });
      const text = await res.text();

      // Try to pretty-print JSON; if not JSON, just show text
      try {
        const obj = JSON.parse(text);
        return JSON.stringify(obj, null, 2);
      } catch {
        return text;
      }
    }

    async function loadOne(title, path) {
      const pre = document.getElementById(`pre-${cssSafeId(path)}`);
      try {
        const out = await fetchPretty(path);
        pre.textContent = out;
        pre.classList.remove("err");
      } catch (e) {
        pre.textContent = `ERROR fetching ${path}\n\n${e?.message ?? e}`;
        pre.classList.add("err");
      }
    }

    async function loadAll() {
      statusEl.textContent = "loading…";
      statusEl.classList.remove("ok");
      const tasks = endpoints.map(e => loadOne(e.title, e.path));
      await Promise.allSettled(tasks);
      statusEl.textContent = "loaded";
      statusEl.classList.add("ok");
    }

    // Build UI
    endpoints.forEach(e => grid.appendChild(cardTemplate(e.title, e.path)));
    loadAll();
    </script>
</body>
</html>
