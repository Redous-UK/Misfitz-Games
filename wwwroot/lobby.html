<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Misfitz Games – Lobby</title>
    <style>
        :root {
            --bg: #070A12;
            --card: rgba(255,255,255,.06);
            --text: #EAF0FF;
            --muted: rgba(234,240,255,.70);
            --accent: #7C3AED;
            --accent2: #06B6D4;
            --danger: #ef4444;
            --ok: #22c55e;
            --shadow: 0 10px 35px rgba(0,0,0,.55);
            --radius: 18px;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
            color: var(--text);
            background: radial-gradient(1200px 700px at 20% 10%, rgba(124,58,237,.28), transparent 55%), radial-gradient(900px 700px at 80% 15%, rgba(6,182,212,.20), transparent 55%), var(--bg);
            min-height: 100vh;
        }

        .hero {
            position: relative;
            padding: 26px 18px 18px;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

            .hero::before {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(180deg, rgba(7,10,18,.18), rgba(7,10,18,.95)), url("/assets/bg.jpg") center/cover no-repeat;
                opacity: .85;
                transform: scale(1.03);
            }

        .wrap {
            position: relative;
            max-width: 1240px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            gap: 14px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .brand img {
                width: 42px;
                height: 42px;
                border-radius: 12px;
                object-fit: cover;
                box-shadow: var(--shadow);
                background: rgba(255,255,255,.06);
                border: 1px solid rgba(255,255,255,.10);
            }

            .brand h1 {
                margin: 0;
                font-size: 18px;
            }

            .brand .tag {
                font-size: 12px;
                color: var(--muted);
                margin-top: 2px;
            }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 999px;
            background: rgba(255,255,255,.05);
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input, select, button {
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.14);
            padding: 12px 12px;
            font-size: 14px;
            outline: none;
        }

        input, select {
            background: rgba(0,0,0,.25);
            color: var(--text);
            min-width: 200px;
        }

            input::placeholder {
                color: rgba(234,240,255,.45);
            }

        button {
            background: linear-gradient(135deg, rgba(124,58,237,.95), rgba(6,182,212,.75));
            color: white;
            cursor: pointer;
            padding: 12px 14px;
            font-weight: 650;
            border: none;
            transition: transform .08s ease, filter .15s ease;
            box-shadow: 0 10px 25px rgba(124,58,237,.22);
        }

            button:hover {
                filter: brightness(1.06);
            }

            button:active {
                transform: translateY(1px) scale(.99);
            }

            button:disabled {
                opacity: .55;
                cursor: not-allowed;
                box-shadow: none;
            }

        .btn-secondary {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.14);
            box-shadow: none;
            color: var(--text);
        }

        .btn-danger {
            background: rgba(239,68,68,.18);
            border: 1px solid rgba(239,68,68,.30);
            box-shadow: none;
            color: #ffd7d7;
        }

        .content {
            padding: 18px 18px 26px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .card {
            border: 1px solid rgba(255,255,255,.12);
            background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
            backdrop-filter: blur(10px);
        }

            .card h2 {
                margin: 0 0 10px;
                font-size: 16px;
                color: rgba(234,240,255,.92);
            }

        .muted {
            color: var(--muted);
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: start;
        }

        @media(max-width:980px) {
            .two {
                grid-template-columns: 1fr;
            }
        }

        pre {
            margin: 10px 0 0;
            background: rgba(0,0,0,.45);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 14px;
            padding: 12px;
            overflow: auto;
            color: #cfe3ff;
            max-height: 260px;
        }

        /* full-width game tiles */
        .games {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        @media(max-width:980px) {
            .games {
                grid-template-columns: 1fr;
            }
        }

        .game-tile {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.06);
            min-height: 140px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform .12s ease, filter .15s ease, border-color .2s ease;
        }

            .game-tile:hover {
                transform: translateY(-2px);
                filter: brightness(1.03);
                border-color: rgba(124,58,237,.35);
            }

            .game-tile[aria-disabled="true"] {
                cursor: not-allowed;
                opacity: .65;
            }

        .game-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: saturate(1.05);
            opacity: .9;
            transform: scale(1.02);
        }

            .game-bg::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(90deg, rgba(7,10,18,.92), rgba(7,10,18,.35));
            }

        .game-inner {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            padding: 14px;
            min-height: 140px;
        }

        .game-title {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            letter-spacing: .2px;
        }

        .game-desc {
            margin: 6px 0 0;
            color: rgba(234,240,255,.72);
            font-size: 13px;
            line-height: 1.35;
        }

        .badge {
            padding: 7px 10px;
            border-radius: 999px;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,.16);
            background: rgba(255,255,255,.06);
            color: rgba(234,240,255,.78);
            white-space: nowrap;
        }

            .badge.ok {
                border-color: rgba(34,197,94,.35);
            }

            .badge.soon {
                border-color: rgba(251,191,36,.35);
            }
        .player-list {
            display: grid;
            gap: 10px;
        }

        .player-card {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            backdrop-filter: blur(10px);
            transition: transform .12s ease, border-color .12s ease, background .12s ease;
        }

            .player-card:hover {
                transform: translateY(-1px);
                border-color: rgba(255,255,255,0.18);
                background: rgba(255,255,255,0.08);
            }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            overflow: hidden;
            flex: 0 0 44px;
            display: grid;
            place-items: center;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.10);
            font-weight: 800;
        }

            .avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

        .meta {
            flex: 1;
            min-width: 0;
        }

        .top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .name {
            font-weight: 750;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badges {
            display: flex;
            gap: 6px;
            flex: 0 0 auto;
        }

        .badge {
            font-size: 11px;
            padding: 4px 7px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.16);
            background: rgba(255,255,255,0.06);
            letter-spacing: .6px;
        }

            .badge.host {
                background: rgba(255,215,0,0.12);
                border-color: rgba(255,215,0,0.25);
            }

            .badge.you {
                background: rgba(0,255,190,0.10);
                border-color: rgba(0,255,190,0.22);
            }

        .bottom {
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .pill {
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.05);
        }

            .pill.ready {
                background: rgba(0,255,120,0.10);
                border-color: rgba(0,255,120,0.22);
            }

            .pill.wait {
                background: rgba(255,170,0,0.10);
                border-color: rgba(255,170,0,0.22);
            }

            .pill.off {
                background: rgba(255,0,90,0.10);
                border-color: rgba(255,0,90,0.22);
            }

        .sub {
            opacity: .75;
            font-size: 12px;
            white-space: nowrap;
        }

        .player-card.is-disconnected {
            opacity: .55;
            filter: grayscale(.2);
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="wrap">
            <div class="topbar">
                <div class="brand">
                    <img src="/assets/logo.png" alt="Misfitz Games" />
                    <div>
                        <h1>Misfitz Games</h1>
                        <div class="tag">Lobby • pick a room • select a game</div>
                    </div>
                </div>

                <div class="row">
                    <span id="meLabel" class="pill">Checking login…</span>
                    <button id="btnLogout" class="btn-secondary">Logout</button>
                    <button id="btnBack" class="btn-secondary">Back to Login</button>
                </div>
            </div>
        </div>
    </section>

    <div class="content">
        <div class="wrap">
            <div class="grid">

                <div class="card">
                    <h2>Room</h2>
                    <div class="row">
                        <input id="roomCode" style="flex:1; min-width:260px" placeholder="Room code (8 digits or custom)" />
                        <button id="btnGetState" class="btn-secondary">Get state</button>
                        <button id="btnOpenOverlay">Open overlay</button>
                    </div>
                    <pre id="stateOut">{}</pre>
                </div>

                <div class="two">
                    <div class="card">
                        <h2>Games</h2>
                        <div class="games" id="gamesGrid"></div>
                        <div class="muted" style="margin-top:10px; font-size:12px;">
                            Tip: Click a game tile to select it. “Start” uses the selected game.
                        </div>
                    </div>

                    <div class="card">
                        <h2>Controls</h2>
                        <div class="row">
                            <span class="pill" id="selectedGamePill">Selected: (none)</span>
                        </div>

                        <div class="row" style="margin-top:10px">
                            <input id="secretWord" style="flex:1; min-width:260px" placeholder="Contexto secret word (optional)" />
                        </div>

                        <div class="row" style="margin-top:10px">
                            <button id="btnStart">Start</button>
                            <button id="btnStop" class="btn-secondary">Stop</button>
                            <button id="btnLeaderboard" class="btn-secondary">Leaderboard</button>
                        </div>

                        <pre id="gameOut">{}</pre>
                    </div>
                </div>

                <div class="player-list" id="playerList"></div>

                <div class="card">
                    <h2>Account</h2>
                    <div class="row">
                        <button id="btnMe" class="btn-secondary">Check login</button>
                    </div>
                    <pre id="authOut">{}</pre>
                </div>

            </div>
        </div>
    </div>

    <script>
        const el = (id) => document.getElementById(id);
        const pretty = (x) => JSON.stringify(x, null, 2);

        let selectedGameId = "contexto"; // default

        async function api(path, opts = {}) {
            const res = await fetch(path, { credentials: "include", ...opts });
            const text = await res.text();
            let json; try { json = text ? JSON.parse(text) : null; } catch { json = { raw: text }; }
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${pretty(json)}`);
            return json;
        }

        function roomId() {
            return el("roomCode").value.trim();
        }

        function setSelectedGame(id) {
            selectedGameId = id;
            el("selectedGamePill").textContent = `Selected: ${id}`;
        }

        async function loadGames() {
            const g = await api("/catalog/games");
            const grid = el("gamesGrid");
            grid.innerHTML = "";

            for (const item of g.games) {
                const tile = document.createElement("div");
                tile.className = "game-tile";
                tile.setAttribute("data-game", item.id);

                if (!item.enabled) tile.setAttribute("aria-disabled", "true");

                const bg = document.createElement("div");
                bg.className = "game-bg";
                bg.style.backgroundImage =
                    item.id === "contexto"
                        ? "url('/assets/Games/contexto.png')"
                        : "url('/assets/Games/deal.png')";

                const inner = document.createElement("div");
                inner.className = "game-inner";

                const left = document.createElement("div");
                const title = document.createElement("div");
                title.className = "game-title";
                title.textContent = item.name;

                const desc = document.createElement("div");
                desc.className = "game-desc";
                desc.textContent = item.description || "";

                left.appendChild(title);
                left.appendChild(desc);

                const badge = document.createElement("span");
                badge.className = "badge " + (item.enabled ? "ok" : "soon");
                badge.textContent = item.enabled ? "Ready" : "Soon";

                inner.appendChild(left);
                inner.appendChild(badge);

                tile.appendChild(bg);
                tile.appendChild(inner);

                tile.onclick = () => {
                    if (!item.enabled) return;
                    setSelectedGame(item.id);
                };

                grid.appendChild(tile);
            }

            setSelectedGame("contexto");
        }

        async function refreshState() {
            try {
                const code = roomId();
                if (!code) return;
                el("stateOut").textContent = pretty(await api(`/rooms/${encodeURIComponent(code)}/state`));
            } catch (e) { el("stateOut").textContent = String(e); }
        }

        async function refreshLeaderboard() {
            try {
                const code = roomId();
                if (!code) return;
                el("gameOut").textContent = pretty(await api(`/rooms/${encodeURIComponent(code)}/leaderboard`));
            } catch (e) { el("gameOut").textContent = String(e); }
        }

        // Buttons
        el("btnBack").onclick = () => location.href = "/user.html";

        el("btnLogout").onclick = async () => {
            try { el("authOut").textContent = pretty(await api("/member/logout", { method: "POST" })); }
            catch (e) { el("authOut").textContent = String(e); }
            location.href = "/user.html";
        };

        el("btnMe").onclick = async () => {
            try {
                const me = await api("/member/me");
                el("authOut").textContent = pretty(me);
                el("meLabel").textContent = me.name ? `👤 ${me.name}` : "Not logged in";
            } catch (e) {
                el("authOut").textContent = String(e);
                el("meLabel").textContent = "Not logged in";
            }
        };

        el("btnGetState").onclick = refreshState;

        el("btnOpenOverlay").onclick = () => {
            const code = roomId();
            if (!code) return alert("Enter a room code first.");
            window.open(`/overlay.html?roomId=${encodeURIComponent(code)}`, "_blank");
        };

        el("btnStart").onclick = async () => {
            try {
                const code = roomId();
                if (!code) return alert("Enter a room code first.");

                if (selectedGameId === "contexto") {
                    const secretWord = el("secretWord").value.trim();
                    const path = secretWord
                        ? `/rooms/${encodeURIComponent(code)}/games/contexto/start`
                        : `/rooms/${encodeURIComponent(code)}/games/contexto/next`;

                    const opts = secretWord
                        ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ secretWord }) }
                        : { method: "POST" };

                    const r = await api(path, opts);
                    el("gameOut").textContent = pretty(r);
                    await refreshState();
                    await refreshLeaderboard();
                    return;
                }

                el("gameOut").textContent = pretty({ ok: false, error: "Game not enabled yet" });
            } catch (e) { el("gameOut").textContent = String(e); }
        };

        el("btnStop").onclick = async () => {
            try {
                const code = roomId();
                if (!code) return alert("Enter a room code first.");
                const r = await api(`/rooms/${encodeURIComponent(code)}/games/stop`, { method: "POST" });
                el("gameOut").textContent = pretty(r);
                await refreshState();
            } catch (e) { el("gameOut").textContent = String(e); }
        };

        el("btnLeaderboard").onclick = refreshLeaderboard;

        // Init
        loadGames().catch(() => { });
        el("btnMe").click();

        roomState = { hostUserId: "...", players: [{ userId, name, avatarUrl, isReady, isConnected }] }

    </script>
    <script>
        // Safe HTML escape (prevents name injection)
        function esc(s) {
            return String(s ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function initials(name) {
            const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
            const a = parts[0]?.[0] ?? "?";
            const b = parts.length > 1 ? parts[parts.length - 1][0] : "";
            return (a + b).toUpperCase();
        }

        function renderPlayers(roomState, currentUserId) {
            const el = document.getElementById("playerList");
            if (!el) return;

            const hostId = roomState?.hostUserId;
            const players = Array.isArray(roomState?.players) ? roomState.players : [];

            // Optional: sort host first, then ready, then name
            const sorted = [...players].sort((p1, p2) => {
                const aHost = p1.userId === hostId ? -1 : 0;
                const bHost = p2.userId === hostId ? -1 : 0;
                if (aHost !== bHost) return aHost - bHost;

                const aReady = p1.isReady ? -1 : 0;
                const bReady = p2.isReady ? -1 : 0;
                if (aReady !== bReady) return aReady - bReady;

                return String(p1.name || "").localeCompare(String(p2.name || ""));
            });

            el.innerHTML = sorted.map(p => {
                const name = p.name ?? "Player";
                const isHost = p.userId === hostId;
                const isYou = p.userId === currentUserId;
                const connected = p.isConnected !== false; // default true
                const ready = !!p.isReady;

                const cardClasses = [
                    "player-card",
                    !connected ? "is-disconnected" : "",
                    isHost ? "is-host" : "",
                    ready ? "is-ready" : ""
                ].filter(Boolean).join(" ");

                const pillClass = connected ? (ready ? "pill ready" : "pill wait") : "pill off";
                const pillText = connected ? (ready ? "Ready" : "Not ready") : "Disconnected";

                const badges = [
                    isHost ? `<span class="badge host">HOST</span>` : "",
                    isYou ? `<span class="badge you">YOU</span>` : ""
                ].filter(Boolean).join("");

                const avatar = p.avatarUrl
                    ? `<img src="${esc(p.avatarUrl)}" alt="avatar" />`
                    : `<span>${esc(initials(name))}</span>`;

                // Optional right-side stat: score/ping/etc
                const rightSub = p.pingMs != null ? `Ping: ${p.pingMs}ms` :
                    p.score != null ? `Score: ${p.score}` : "";

                return `
            <div class="${cardClasses}">
              <div class="avatar">${avatar}</div>
              <div class="meta">
                <div class="top">
                  <div class="name">${esc(name)}</div>
                  <div class="badges">${badges}</div>
                </div>
                <div class="bottom">
                  <span class="${pillClass}">${esc(pillText)}</span>
                  <span class="sub">${esc(rightSub)}</span>
                </div>
              </div>
            </div>
          `;
            }).join("");
        }

        // Example usage (call whenever you receive new state from server)
        // renderPlayers(roomState, myUserId);
    </script>
</body>
</html>
