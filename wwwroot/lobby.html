<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Misfitz Games – Lobby</title>
    <link rel="stylesheet" href="/site.css" />
</head>
<body>

    <section class="hero">
        <div class="wrap">
            <div class="topbar">
                <div class="brand">
                    <img src="/assets/logo.png" alt="Misfitz Games" />
                    <div>
                        <h1>Misfitz Games</h1>
                        <div class="tag">Lobby • pick a room • select a game</div>
                    </div>
                </div>

                <div class="row">
                    <span id="meLabel" class="pill">Checking login…</span>
                    <button id="btnAdmin" class="btn-secondary" style="display:none">Admin</button>
                    <button id="btnLogout" class="btn-secondary">Logout</button>
                    <button id="btnBack" class="btn-secondary">Back to Login</button>
                </div>
            </div>
        </div>
    </section>

    <div class="content">
        <div class="wrap">
            <div class="grid">

                <div class="card">
                    <h2>Room</h2>
                    <div class="row">
                        <button id="btnRefreshRooms" class="btn-secondary">Refresh rooms</button>
                        <button id="btnOpenOverlay" class="btn-secondary" disabled>Open overlay</button>
                        <span class="pill" id="activeRoomPill">Room: (none)</span>
                    </div>

                    <div id="roomsGrid" class="rooms-grid" style="margin-top:12px"></div>

                    <pre id="stateOut">{}</pre>
                </div>

                <div class="two">
                    <div class="card">
                        <h2>Games</h2>
                        <div class="games" id="gamesGrid"></div>
                        <div class="muted" style="margin-top:10px; font-size:12px;">
                            Tip: Click a game tile to select it. “Start” uses the selected game.
                        </div>
                    </div>

                    <div class="card">
                        <h2>Controls</h2>
                        <div class="row">
                            <span class="pill" id="selectedGamePill">Selected: (none)</span>
                        </div>

                        <div class="row" style="margin-top:10px">
                            <input id="secretWord" style="flex:1; min-width:260px" placeholder="Contexto secret word (optional)" />
                        </div>

                        <div class="row" style="margin-top:10px">
                            <button id="btnStart">Start</button>
                            <button id="btnStop" class="btn-secondary">Stop</button>
                            <button id="btnPlay" class="btn-secondary">Play</button>
                            <button id="btnLeaderboard" class="btn-secondary">Leaderboard</button>
                        </div>

                        <pre id="gameOut">{}</pre>
                    </div>
                </div>

                <!-- Player cards live here -->
                <div class="card">
                    <h2>Players</h2>
                    <div class="player-list" id="playerList"></div>
                    <div class="muted" style="margin-top:10px; font-size:12px;">Tip: Click “Get state” after entering a room code to load players.</div>
                </div>

                <div class="card">
                    <h2>Account</h2>
                    <div class="row">
                        <button id="btnMe" class="btn-secondary">Check login</button>
                    </div>
                    <pre id="authOut">{}</pre>
                </div>

            </div>
        </div>
    </div>

    <script>
        const el = (id) => document.getElementById(id);
        const pretty = (x) => JSON.stringify(x, null, 2);

        let selectedGameId = "contexto"; // default

        const ROLE_CAPS = {
            admin: {
                admin: true,
                start: true,
                stop: true
            },
            member: {
                admin: false,
                start: true,
                stop: true
            },
            guest: {
                admin: false,
                start: false,
                stop: false
            }
        };

        // Keep these globally so we can render whenever state/me changes
        let myUserId = null;
        let currentRoomState = null;

        let activeRoomCode = null;
        let roomsPollHandle = null;

        function setActiveRoom(code) {
            const c = (code || "").trim();
            activeRoomCode = c || null;

            el("activeRoomPill").textContent = activeRoomCode ? `Room: ${activeRoomCode}` : "Room: (none)";
            el("btnOpenOverlay").disabled = !activeRoomCode;

            if (activeRoomCode) localStorage.setItem("activeRoomCode", activeRoomCode);

            refreshState();
            refreshLeaderboard();
        }

        async function loadRooms() {
            const grid = el("roomsGrid");
            grid.innerHTML = `<div class="muted">Loading rooms…</div>`;

            try {
                const rooms = await api("/rooms");
                // rooms is expected to be an array of RoomDto
                if (!Array.isArray(rooms) || rooms.length === 0) {
                    grid.innerHTML = `<div class="muted">No rooms yet. Create one by logging in, or wait for someone else.</div>`;
                    return;
                }

                // Sort newest first (optional)
                rooms.sort((a, b) => String(b.createdAtUtc || "").localeCompare(String(a.createdAtUtc || "")));

                grid.innerHTML = rooms.map(r => {
                    const code = r.roomCode ?? "";
                    const name = r.name ?? "Room";
                    const created = r.createdAtUtc ? new Date(r.createdAtUtc).toLocaleString() : "";
                    const isActive = activeRoomCode && activeRoomCode === code;

                    return `
        <div class="room-tile" data-code="${esc(code)}">
          <div class="room-title">${esc(name)}</div>
          <div class="room-sub">Code: <b>${esc(code)}</b>${created ? ` • Created: ${esc(created)}` : ""}</div>
          <div class="room-meta">
            <span class="room-chip ${isActive ? "active" : ""}">${isActive ? "ACTIVE" : "JOIN"}</span>
          </div>
        </div>
      `;
                }).join("");

                grid.querySelectorAll(".room-tile[data-code]").forEach(tile => {
                    tile.onclick = () => {
                        const code = tile.getAttribute("data-code");
                        if (!code) return;
                        setActiveRoom(code);
                        startPolling(); // ensure player cards keep updating
                    };
                });

            } catch (e) {
                grid.innerHTML = `<div class="muted">Failed to load rooms: ${esc(String(e))}</div>`;
            }
        }

        async function api(path, opts = {}) {
            const res = await fetch(path, { credentials: "include", ...opts });
            const text = await res.text();
            let json; try { json = text ? JSON.parse(text) : null; } catch { json = { raw: text }; }
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${pretty(json)}`);
            return json;
        }

        let pollHandle = null;

        function startPolling() {
            if (pollHandle) return;
            pollHandle = setInterval(() => {
                // don’t spam when tab is hidden
                if (document.hidden) return;
                const code = roomId();
                if (!code) return;
                refreshState(); // refreshState already re-renders players
                refreshLeaderboard(); // uncomment if you want it live too
            }, 2000); // 2s is a good start
        }

        function roomId() {
            return activeRoomCode || el("roomCode").value.trim();
        }

        function setSelectedGame(id) {
            selectedGameId = id;
            el("selectedGamePill").textContent = `Selected: ${id}`;
        }

        // Safe HTML escape (prevents name injection)
        function esc(s) {
            return String(s ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function initials(name) {
            const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
            const a = parts[0]?.[0] ?? "?";
            const b = parts.length > 1 ? parts[parts.length - 1][0] : "";
            return (a + b).toUpperCase();
        }

        function renderPlayers(roomState, currentUserId) {
            const container = document.getElementById("playerList");
            if (!container) return;

            const hostId = roomState?.hostUserId;
            const players = Array.isArray(roomState?.players) ? roomState.players : [];

            if (!players.length) {
                container.innerHTML = `<div class="muted">No players yet — join the room to appear here.</div>`;
                return;
            }

            // Optional: sort host first, then ready, then name
            const sorted = [...players].sort((p1, p2) => {
                const aHost = p1.userId === hostId ? -1 : 0;
                const bHost = p2.userId === hostId ? -1 : 0;
                if (aHost !== bHost) return aHost - bHost;

                const aReady = p1.isReady ? -1 : 0;
                const bReady = p2.isReady ? -1 : 0;
                if (aReady !== bReady) return aReady - bReady;

                return String(p1.name || "").localeCompare(String(p2.name || ""));
            });

            container.innerHTML = sorted.map(p => {
                const name = p.name ?? "Player";
                const isHost = p.userId === hostId;
                const isYou = currentUserId && p.userId === currentUserId;
                const connected = p.isConnected !== false; // default true
                const ready = !!p.isReady;

                const cardClasses = [
                    "player-card",
                    !connected ? "is-disconnected" : "",
                ].filter(Boolean).join(" ");

                const pillClass = connected ? (ready ? "pill-sm ready" : "pill-sm wait") : "pill-sm off";
                const pillText = connected ? (ready ? "Ready" : "Not ready") : "Disconnected";

                const badges = [
                    isHost ? `<span class="player-badge host">HOST</span>` : "",
                    isYou ? `<span class="player-badge you">YOU</span>` : ""
                ].filter(Boolean).join("");

                const avatar = p.avatarUrl
                    ? `<img src="${esc(p.avatarUrl)}" alt="avatar" />`
                    : `<span>${esc(initials(name))}</span>`;

                const rightSub = p.pingMs != null ? `Ping: ${p.pingMs}ms` :
                    p.score != null ? `Score: ${p.score}` : "";

                return `
                            <div class="${cardClasses}">
                                <div class="avatar">${avatar}</div>
                                <div class="meta">
                                    <div class="top">
                                        <div class="name">${esc(name)}</div>
                                        <div class="badges">${badges}</div>
                                    </div>
                                    <div class="bottom">
                                        <span class="${pillClass}">${esc(pillText)}</span>
                                        <span class="sub">${esc(rightSub)}</span>
                                    </div>
                                </div>
                            </div>
                        `;
            }).join("");
        }

        async function loadGames() {
            const g = await api("/catalog/games");
            const grid = el("gamesGrid");
            grid.innerHTML = "";

            for (const item of g.games) {
                const tile = document.createElement("div");
                tile.className = "game-tile";
                tile.setAttribute("data-game", item.id);

                if (!item.enabled) tile.setAttribute("aria-disabled", "true");

                const bg = document.createElement("div");
                bg.className = "game-bg";
                bg.style.backgroundImage =
                    item.id === "contexto"
                        ? "url('/assets/Games/contexto.png')"
                        : "url('/assets/Games/deal.png')";

                const inner = document.createElement("div");
                inner.className = "game-inner";

                const left = document.createElement("div");
                const title = document.createElement("div");
                title.className = "game-title";
                title.textContent = item.name;

                const desc = document.createElement("div");
                desc.className = "game-desc";
                desc.textContent = item.description || "";

                left.appendChild(title);
                left.appendChild(desc);

                const badge = document.createElement("span");
                badge.className = "tile-badge " + (item.enabled ? "ok" : "soon");
                badge.textContent = item.enabled ? "Ready" : "Soon";

                inner.appendChild(left);
                inner.appendChild(badge);

                tile.appendChild(bg);
                tile.appendChild(inner);

                tile.onclick = () => {
                    if (!item.enabled) return;
                    setSelectedGame(item.id);
                };

                grid.appendChild(tile);
            }

            setSelectedGame("contexto");
        }

        async function refreshState() {
            try {
                const code = roomId();
                if (!code) return;

                saveRoomToStorage(code);

                const raw = await api(`/rooms/${encodeURIComponent(code)}/state`);
                // ✅ support both shapes: state is either raw or raw.state
                const state = raw?.state ?? raw;

                currentRoomState = state;

                currentRoomState = await api(`/rooms/${encodeURIComponent(code)}/state`);

                console.log("STATE FETCH", {
                    code,
                    keys: Object.keys(currentRoomState || {}),
                    playersIsArray: Array.isArray(currentRoomState?.players),
                    playersCount: Array.isArray(currentRoomState?.players) ? currentRoomState.players.length : null,
                    currentRoomState
                });

                el("stateOut").textContent = pretty(raw); // keep showing raw for debugging

                renderPlayers(state, myUserId);
            } catch (e) {
                el("stateOut").textContent = String(e);
            }
        }

        async function refreshLeaderboard() {
            try {
                const code = roomId();
                if (!code) return;
                el("gameOut").textContent = pretty(await api(`/rooms/${encodeURIComponent(code)}/leaderboard`));
            } catch (e) { el("gameOut").textContent = String(e); }
        }

        function renderPlayers(roomState, currentUserId) {

            // 🔍 DEBUG — PUT IT RIGHT HERE
            console.log("renderPlayers", {
                hostUserId: roomState?.hostUserId,
                playersType: typeof roomState?.players,
                playersCount: Array.isArray(roomState?.players)
                    ? roomState.players.length
                    : null,
                roomState
            });

            const container = document.getElementById("playerList");
            if (!container) return;

            const hostId = roomState?.hostUserId;
            const players = Array.isArray(roomState?.players) ? roomState.players : [];

            if (!players.length) {
                container.innerHTML = `<div class="muted">No players yet — join the room to appear here.</div>`;
                return;
            }

            // existing rendering logic continues…
        }

        function applyRoleUI(role) {
            const caps = ROLE_CAPS[role] ?? ROLE_CAPS.guest;

            el("btnAdmin").style.display = caps.admin ? "" : "none";
            el("btnStart").style.display = caps.start ? "" : "none";
            el("btnStop").style.display = caps.stop ? "" : "none";
        }

        function autoLoadRoomFromStorage() {
            const saved = localStorage.getItem("activeRoomCode");
            if (!saved) return false;

            setActiveRoom(saved);

            // Load state + leaderboard immediately
            refreshState();
            refreshLeaderboard();
            return true;
        }

        function saveRoomToStorage(code) {
            if (code) localStorage.setItem("roomId", code);
        }

        // Buttons
        el("btnBack").onclick = () => location.href = "/user.html";

        el("btnLogout").onclick = async () => {
            try { el("authOut").textContent = pretty(await api("/member/logout", { method: "POST" })); }
            catch (e) { el("authOut").textContent = String(e); }
            location.href = "/user.html";
        };

        el("btnMe").onclick = async () => {
            try {
                const me = await api("/member/me");
                el("authOut").textContent = pretty(me);

                el("meLabel").textContent = me.isAuth
                    ? `👤 ${me.name ?? "Signed in"} (${me.role ?? "user"})`
                    : "Not logged in";

                // IMPORTANT: keep myUserId for player cards ("YOU" badge)
                myUserId = me.userId || null;

                // ✅ Apply Role Buttons
                applyRoleUI(me.role);

                // If we already have state, re-render players with correct YOU badge
                if (currentRoomState) renderPlayers(currentRoomState, myUserId);
            } catch (e) {
                el("authOut").textContent = String(e);
                el("meLabel").textContent = "Not logged in";
                el("btnAdmin").style.display = "none";
                myUserId = null;
            }
        };

        el("btnAdmin").onclick = () => {
            location.href = "/admin.html";
        };

        el("btnPlay").onclick = () => {
            const code = roomId();
            if (!code) return alert("Enter a room code first.");
            const game = selectedGameId || "contexto";
            location.href = `/play.html?roomId=${encodeURIComponent(code)}&game=${encodeURIComponent(game)}`;
        };

        el("btnRefreshRooms").onclick = () => loadRooms();

        el("btnOpenOverlay").onclick = () => {
            const code = roomId();
            if (!code) return alert("Pick a room first.");
            window.open(`/overlay.html?roomId=${encodeURIComponent(code)}`, "_blank");
        };

        el("btnStart").onclick = async () => {
            try {
                const code = roomId();
                if (!code) return alert("Enter a room code first.");

                if (selectedGameId === "contexto") {
                    const secretWord = el("secretWord").value.trim();
                    const path = secretWord
                        ? `/rooms/${encodeURIComponent(code)}/games/contexto/start`
                        : `/rooms/${encodeURIComponent(code)}/games/contexto/next`;

                    const opts = secretWord
                        ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ secretWord }) }
                        : { method: "POST" };

                    const r = await api(path, opts);
                    el("gameOut").textContent = pretty(r);
                    await refreshState();
                    await refreshLeaderboard();
                    return;
                }

                el("gameOut").textContent = pretty({ ok: false, error: "Game not enabled yet" });
            } catch (e) { el("gameOut").textContent = String(e); }
        };

        el("btnStop").onclick = async () => {
            try {
                const code = roomId();
                if (!code) return alert("Enter a room code first.");
                const r = await api(`/rooms/${encodeURIComponent(code)}/games/stop`, { method: "POST" });
                el("gameOut").textContent = pretty(r);
                await refreshState();
            } catch (e) { el("gameOut").textContent = String(e); }
        };

        el("btnLeaderboard").onclick = refreshLeaderboard;

        // Init
        async function init() {
            // Load tiles (does not depend on auth)
            loadGames().catch(() => { });

            // Run auth first so we get myUserId for YOU badge
            await el("btnMe").onclick();

            if (!myUserId) {
                location.href = "/user.html";
                return;
            }

            // Auto-load the room created at login (if any)
            autoLoadRoomFromStorage(); // <-- DO NOT return here
            await loadRooms();              // show rooms list
            // ✅ Always poll so player cards update
            startPolling();

            // Optional: also enforce auth
            try {
                const me = await api("/member/me");
                if (!me.isAuth) location.href = "/user.html";
            } catch {
                location.href = "/user.html";
            }
        }

        init().catch(() => location.href = "/user.html");
    </script>
</body>
</html>
