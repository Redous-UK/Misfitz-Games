<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Misfitz Games – Lobby</title>
    <link rel="stylesheet" href="/site.css" />
</head>
<body>
    <section class="hero">
        <div class="wrap">
            <div class="topbar">
                <div class="brand">
                    <img src="/assets/logo.png" alt="Misfitz Games" />
                    <div>
                        <h1>Misfitz Games</h1>
                        <div class="tag">Lobby • pick a room • select a game</div>
                    </div>
                </div>

                <div class="row">
                    <span id="meLabel" class="pill">Checking login…</span>
                    <button id="btnAdmin" class="btn-secondary" style="display:none">Admin</button>
                    <button id="btnLogout" class="btn-secondary">Logout</button>
                    <button id="btnBack" class="btn-secondary">Back to Login</button>
                </div>
            </div>
        </div>
    </section>

    <div class="content">
        <div class="wrap">
            <div class="grid">

                <div class="card">
                    <h2>Room</h2>
                    <div class="row">
                        <button id="btnRefreshRooms" class="btn-secondary">Refresh rooms</button>
                        <button id="btnOpenOverlay" class="btn-secondary" disabled>Open overlay</button>
                        <span class="pill" id="activeRoomPill">Room: (none)</span>
                    </div>

                    <div id="roomsGrid" class="rooms-grid" style="margin-top:12px"></div>

                    <pre id="stateOut">{}</pre>
                </div>


                <div class="card">
                    <h2>Games</h2>
                    <div class="games" id="gamesGrid"></div>
                    <div class="muted" style="margin-top:10px; font-size:12px;">
                        Tip: Click a game tile to select it. “Start” uses the selected game.
                    </div>
                </div>


                <div class="card">
                    <h2>Players</h2>
                    <div class="player-list" id="playerList"></div>
                    <div class="muted" style="margin-top:10px; font-size:12px;">Tip: Players list updates automatically while a room is selected.</div>
                </div>

                <div class="card">
                    <h2>Account</h2>
                    <div class="row">
                        <button id="btnMe" class="btn-secondary">Check login</button>
                    </div>
                    <pre id="authOut">{}</pre>
                </div>

            </div>
        </div>
    </div>

    <!-- Floating settings button -->
    <button id="settingsBtn"
            class="settings-btn"
            aria-label="Open settings"
            aria-controls="settingsPanel"
            aria-expanded="false">
        ⚙️
    </button>

    <!-- Overlay (click to close) -->
    <div id="settingsOverlay" class="settings-overlay" hidden></div>

    <!-- Side panel -->
    <aside id="settingsPanel" class="settings-panel" aria-hidden="true" role="dialog" aria-label="Lobby settings">
        <div class="settings-header">
            <h2>Controls</h2>
            <button id="settingsCloseBtn" class="settings-close" aria-label="Close settings">✕</button>
        </div>

        <div class="settings-content">
            <!-- Move your existing lobby controls into here -->
            <!-- Example placeholders: -->
            <h2>Controls</h2>

            <div class="control-block">
                <label class="control-label" for="nameInput">Display name</label>
                <input id="username" class="control-input" />
            </div>

            <div id="controlPanelHost" class="settings-content"></div>
        </div>
    </aside>

    <script>
        const el = (id) => document.getElementById(id);

        function onClick(id, handler) {
            const node = el(id);
            if (!node) {
                console.warn(`[bind] missing #${id}`);
                return false;
            }
            node.addEventListener("click", handler);
            return true;
        }

        const pretty = (x) => JSON.stringify(x, null, 2);

        const ROLE_CAPS = {
            admin: { admin: true, start: true, stop: true },
            member: { admin: false, start: true, stop: true },
            guest: { admin: false, start: false, stop: false }
        };

        let myUserId = null;
        let currentRoomState = null;

        let activeRoomCode = null;
        let pollHandle = null;

        const gameSettings = {}; // { [gameId]: { key: value } }

        function ensureDefaults(gameId) {
            const schema = GAME_CONTROL_SCHEMAS[gameId];
            if (!schema) return;

            gameSettings[gameId] ??= {};
            for (const c of schema.controls) {
                if (gameSettings[gameId][c.key] === undefined && c.default !== undefined) {
                    gameSettings[gameId][c.key] = c.default;
                }
            }
        }

        async function sendPresenceForRoom(code) {
            if (!code) return;
            try {
                await api("/ingest/event", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        roomId: code,
                        platform: "web",
                        channelId: "lobby",
                        type: "presence",
                        message: "",
                        tsUtc: new Date().toISOString()
                    })
                });
            } catch (e) {
                console.warn("presence ping failed", e);
            }
        }

        function renderControlPanel(gameId) {
            const host = document.getElementById("controlPanelHost");
            if (!host) return;

            host.innerHTML = ""; // ✅ refresh (wipe and rebuild)

            if (!gameId) {
                host.innerHTML = `<div style="opacity:.8">Select a game to see controls.</div>`;
                return;
            }

            const schema = GAME_CONTROL_SCHEMAS[gameId];
            ensureDefaults(gameId);

            // header
            const header = document.createElement("div");
            header.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;">
      <div>
        <div style="font-size:18px;font-weight:700">${schema?.title ?? "Controls"}</div>
        <div style="opacity:.75">Selected: <b>${gameId}</b></div>
      </div>
      <button id="resetGameSettingsBtn" class="control-button" style="width:auto;padding:10px 12px;">Reset</button>
    </div>
  `;
            host.appendChild(header);

            // reset handler
            header.querySelector("#resetGameSettingsBtn").addEventListener("click", () => {
                gameSettings[gameId] = {};
                ensureDefaults(gameId);
                renderControlPanel(gameId); // ✅ refresh
            });

            // no schema fallback
            if (!schema) {
                const p = document.createElement("div");
                p.style.opacity = "0.8";
                p.textContent = "No custom controls defined for this game yet.";
                host.appendChild(p);
                host.appendChild(renderCommonLobbyControls(gameId));
                return;
            }

            // controls list
            for (const c of schema.controls) {
                // depends-on support
                if (c.dependsOn) {
                    const v = gameSettings[gameId]?.[c.dependsOn.key];
                    if (v !== c.dependsOn.value) continue;
                }

                host.appendChild(renderControl(gameId, c));
            }

            // common lobby controls (room, username, join/play, etc.)
            host.appendChild(renderCommonLobbyControls(gameId));
        }

        function renderControl(gameId, c) {
            const wrap = document.createElement("div");
            wrap.className = "control-block";

            // Toggle
            if (c.type === "toggle") {
                const row = document.createElement("div");
                row.style.display = "flex";
                row.style.alignItems = "center";
                row.style.justifyContent = "space-between";
                row.style.gap = "12px";

                const label = document.createElement("div");
                label.style.opacity = "0.9";
                label.textContent = c.label;

                const input = document.createElement("input");
                input.type = "checkbox";
                input.checked = !!gameSettings[gameId][c.key];

                input.addEventListener("change", () => {
                    gameSettings[gameId][c.key] = input.checked;
                    renderControlPanel(gameId); // ✅ refresh panel so dependent controls show/hide
                });

                row.appendChild(label);
                row.appendChild(input);
                wrap.appendChild(row);
                return wrap;
            }

            // Label for select/number/text
            const label = document.createElement("label");
            label.className = "control-label";
            label.textContent = c.label;
            wrap.appendChild(label);

            let input;

            if (c.type === "select") {
                input = document.createElement("select");
                input.className = "control-input";
                for (const opt of c.options) {
                    const o = document.createElement("option");
                    o.value = opt.value;
                    o.textContent = opt.label;
                    input.appendChild(o);
                }
                input.value = String(gameSettings[gameId][c.key] ?? c.default ?? "");

                input.addEventListener("change", () => {
                    gameSettings[gameId][c.key] = input.value;
                    renderControlPanel(gameId); // ✅ refresh if something depends on it
                });

            } else if (c.type === "number") {
                input = document.createElement("input");
                input.type = "number";
                input.className = "control-input";
                if (c.min != null) input.min = String(c.min);
                if (c.max != null) input.max = String(c.max);
                if (c.step != null) input.step = String(c.step);

                input.value = String(gameSettings[gameId][c.key] ?? c.default ?? "");

                input.addEventListener("input", () => {
                    // store as number (or null)
                    gameSettings[gameId][c.key] = input.value === "" ? null : Number(input.value);
                    // no need to refresh on each keypress; only if dependencies exist
                });

                input.addEventListener("change", () => {
                    renderControlPanel(gameId); // ✅ refresh on commit if needed
                });

            } else {
                input = document.createElement("input");
                input.type = "text";
                input.className = "control-input";
                input.value = String(gameSettings[gameId][c.key] ?? c.default ?? "");

                input.addEventListener("input", () => {
                    gameSettings[gameId][c.key] = input.value;
                });
            }

            wrap.appendChild(input);
            return wrap;
        }

        function onSelectGame(gameId) {
            selectedGameId = gameId;
            renderControlPanel(gameId); // ✅ refresh panel content
            openSettingsPanel();        // optional
        }

        async function api(path, opts = {}) {
            const res = await fetch(path, { credentials: "include", ...opts });
            const text = await res.text();
            let json;
            try { json = text ? JSON.parse(text) : null; } catch { json = { raw: text }; }
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${pretty(json)}`);
            return json;
        }

        function esc(s) {
            return String(s ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function initials(name) {
            const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
            const a = parts[0]?.[0] ?? "?";
            const b = parts.length > 1 ? parts[parts.length - 1][0] : "";
            return (a + b).toUpperCase();
        }

        function applyRoleUI(role) {
            const caps = ROLE_CAPS[(role || "").toLowerCase()] ?? ROLE_CAPS.guest;
            el("btnAdmin").style.display = caps.admin ? "" : "none";
            el("btnStart").style.display = caps.start ? "" : "none";
            el("btnStop").style.display = caps.stop ? "" : "none";
        }

        function roomId() {
            return activeRoomCode; // ONLY from room picker now
        }

        function setActiveRoom(code) {
            const c = (code || "").trim();
            activeRoomCode = c || null;

            el("activeRoomPill").textContent = activeRoomCode ? `Room: ${activeRoomCode}` : "Room: (none)";
            el("btnOpenOverlay").disabled = !activeRoomCode;

            if (activeRoomCode) localStorage.setItem("activeRoomCode", activeRoomCode);

            // refresh immediately and ensure polling is running
            refreshState();
            refreshLeaderboard();
            startPolling();
        }

        function autoLoadRoomFromStorage() {
            const saved = localStorage.getItem("activeRoomCode");
            if (!saved) return false;
            setActiveRoom(saved);
            return true;
        }

        function startPolling() {
            if (pollHandle) return;
            pollHandle = setInterval(() => {
                if (document.hidden) return;
                const code = roomId();
                if (!code) return;

                sendPresenceForRoom(code);
                refreshState();
                refreshLeaderboard();
            }, 5000);
        }

        async function loadRooms() {
            const grid = el("roomsGrid");
            grid.innerHTML = `<div class="muted">Loading rooms…</div>`;

            try {
                const rooms = await api("/rooms");
                if (!Array.isArray(rooms) || rooms.length === 0) {
                    grid.innerHTML = `<div class="muted">No rooms yet.</div>`;
                    return;
                }

                rooms.sort((a, b) => String(b.createdAtUtc || "").localeCompare(String(a.createdAtUtc || "")));

                grid.innerHTML = rooms.map(r => {
                    const code = r.roomCode ?? "";
                    const name = r.name ?? "Room";
                    const created = r.createdAtUtc ? new Date(r.createdAtUtc).toLocaleString() : "";
                    const isActive = activeRoomCode && activeRoomCode === code;

                    return `
                        <div class="room-tile" data-code="${esc(code)}">
                          <div class="room-title">${esc(name)}</div>
                          <div class="room-sub">Code: <b>${esc(code)}</b>${created ? ` • Created: ${esc(created)}` : ""}</div>
                          <div class="room-meta">
                            <span class="room-chip ${isActive ? "active" : ""}">${isActive ? "ACTIVE" : "JOIN"}</span>
                          </div>
                        </div>
                      `;
                }).join("");

                grid.querySelectorAll(".room-tile[data-code]").forEach(tile => {
                    tile.onclick = async () => {
                        const code = tile.getAttribute("data-code");
                        if (!code) return;
                        setActiveRoom(code);

                        await sendPresenceForRoom(code);

                        await refreshState();
                        await refreshLeaderboard();

                        startPolling();
                    };
                });

            } catch (e) {
                grid.innerHTML = `<div class="muted">Failed to load rooms: ${esc(String(e))}</div>`;
            }
        }

        async function refreshState() {
            try {
                const code = roomId();
                if (!code) {
                    el("stateOut").textContent = "Pick a room to see state.";
                    el("playerList").innerHTML = `<div class="muted">Pick a room to see players.</div>`;
                    return;
                }

                const raw = await api(`/rooms/${encodeURIComponent(code)}/state`);
                const state = raw?.state ?? raw; // support both shapes

                currentRoomState = state;

                // Debug view
                el("stateOut").textContent = pretty(raw);

                // Render players from the SAME parsed state
                renderPlayers(state, myUserId);

            } catch (e) {
                el("stateOut").textContent = String(e);
            }
        }

        async function refreshLeaderboard() {
            try {
                const code = roomId();
                if (!code) return;
                el("gameOut").textContent = pretty(await api(`/rooms/${encodeURIComponent(code)}/leaderboard`));
            } catch (e) {
                el("gameOut").textContent = String(e);
            }
        }

        function renderPlayers(roomState, currentUserId) {
            // Optional debug
            // console.log("renderPlayers", {
            //   hostUserId: roomState?.hostUserId,
            //   playersIsArray: Array.isArray(roomState?.players),
            //   playersCount: Array.isArray(roomState?.players) ? roomState.players.length : null,
            // });

            const container = el("playerList");
            if (!container) return;

            const hostId = roomState?.hostUserId;
            const players = Array.isArray(roomState?.players) ? roomState.players : [];

            if (!players.length) {
                container.innerHTML = `<div class="muted">No players yet — join the room to appear here.</div>`;
                return;
            }

            const sorted = [...players].sort((p1, p2) => {
                const aHost = p1.userId === hostId ? -1 : 0;
                const bHost = p2.userId === hostId ? -1 : 0;
                if (aHost !== bHost) return aHost - bHost;

                const aReady = p1.isReady ? -1 : 0;
                const bReady = p2.isReady ? -1 : 0;
                if (aReady !== bReady) return aReady - bReady;

                return String(p1.name || "").localeCompare(String(p2.name || ""));
            });

            container.innerHTML = sorted.map(p => {
                const name = p.name ?? "Player";
                const isHost = p.userId === hostId;
                const isYou = currentUserId && p.userId === currentUserId;
                const connected = p.isConnected !== false;
                const ready = !!p.isReady;

                const cardClasses = ["player-card", !connected ? "is-disconnected" : ""].filter(Boolean).join(" ");

                const pillClass = connected ? (ready ? "pill-sm ready" : "pill-sm wait") : "pill-sm off";
                const pillText = connected ? (ready ? "Ready" : "Not ready") : "Disconnected";

                const badges = [
                    isHost ? `<span class="player-badge host">HOST</span>` : "",
                    isYou ? `<span class="player-badge you">YOU</span>` : ""
                ].filter(Boolean).join("");

                const avatar = p.avatarUrl
                    ? `<img src="${esc(p.avatarUrl)}" alt="avatar" />`
                    : `<span>${esc(initials(name))}</span>`;

                const rightSub = p.pingMs != null ? `Ping: ${p.pingMs}ms` : (p.score != null ? `Score: ${p.score}` : "");

                return `
                      <div class="${cardClasses}">
                        <div class="avatar">${avatar}</div>
                        <div class="meta">
                          <div class="top">
                            <div class="name">${esc(name)}</div>
                            <div class="badges">${badges}</div>
                          </div>
                          <div class="bottom">
                            <span class="${pillClass}">${esc(pillText)}</span>
                            <span class="sub">${esc(rightSub)}</span>
                          </div>
                        </div>
                      </div>
                    `;
            }).join("");
        }

        // Ensure these exist somewhere globally
        let selectedGameId = window.selectedGameId || "contexto";

        async function loadGames() {
            console.log("Loading games...");

            const grid = el("gamesGrid");
            const pill = el("selectedGamePill");

            if (!grid) {
                console.error("Missing #gamesGrid element");
                return;
            }

            grid.innerHTML = "";

            let payload;
            try {
                payload = await api("/catalog/games");
            } catch (err) {
                console.error("Failed to fetch /catalog/games", err);
                grid.innerHTML = "<div class='error'>Failed to load games.</div>";
                return;
            }

            console.log("Games payload:", payload);

            const games = payload?.games;
            if (!Array.isArray(games)) {
                console.error("Payload does not contain games[]", payload);
                grid.innerHTML = "<div class='error'>Invalid games payload.</div>";
                return;
            }

            for (const item of games) {
                const tile = document.createElement("div");
                tile.className = "game-tile";
                tile.dataset.game = item.id;

                if (!item.enabled) {
                    tile.setAttribute("aria-disabled", "true");
                    tile.classList.add("is-disabled");
                }

                const bg = document.createElement("div");
                bg.className = "game-bg";
                const imageUrl = item.image || "/assets/Games/placeholder.png";
                bg.style.backgroundImage = `url('${imageUrl}')`;

                const inner = document.createElement("div");
                inner.className = "game-inner";

                const left = document.createElement("div");

                const title = document.createElement("div");
                title.className = "game-title";
                title.textContent = item.name || item.id;

                const desc = document.createElement("div");
                desc.className = "game-desc";
                desc.textContent = item.description || "";

                left.appendChild(title);
                left.appendChild(desc);

                const badge = document.createElement("span");
                badge.className = "tile-badge " + (item.enabled ? "ok" : "soon");
                badge.textContent = item.enabled ? "Ready" : "Soon";

                inner.appendChild(left);
                inner.appendChild(badge);

                tile.appendChild(bg);
                tile.appendChild(inner);

                tile.addEventListener("click", () => {
                    if (!item.enabled) return;

                    selectedGameId = item.id;

                    // Visual selected state
                    document.querySelectorAll(".game-tile.is-selected")
                        .forEach(x => x.classList.remove("is-selected"));
                    tile.classList.add("is-selected");

                    if (pill) pill.textContent = `Selected: ${item.name}`;
                });

                grid.appendChild(tile);
            }

            if (pill) pill.textContent = `Selected: ${selectedGameId}`;
        }

        // Important: run AFTER DOM is loaded
        document.addEventListener("DOMContentLoaded", loadGames);

        // Buttons
        el("btnBack").onclick = () => location.href = "/user.html";

        el("btnLogout").onclick = async () => {
            try {
                el("authOut").textContent = pretty(await api("/member/logout", { method: "POST" }));
            } catch (e) {
                el("authOut").textContent = String(e);
            }
            location.href = "/user.html";
        };

        el("btnMe").onclick = async () => {
            try {
                const me = await api("/member/me");
                el("authOut").textContent = pretty(me);

                el("meLabel").textContent = me.isAuth
                    ? `👤 ${me.name ?? "Signed in"} (${me.role ?? "user"})`
                    : "Not logged in";

                myUserId = me.userId || null;
                applyRoleUI(me.role);

                if (currentRoomState) renderPlayers(currentRoomState, myUserId);

            } catch (e) {
                el("authOut").textContent = String(e);
                el("meLabel").textContent = "Not logged in";
                el("btnAdmin").style.display = "none";
                myUserId = null;
            }
        };

        el("btnAdmin").onclick = () => location.href = "/admin.html";

        onClick("btnPlay", () => {
            const code = roomId();
            if (!code) return alert("Pick a room first.");
            const game = selectedGameId || "contexto";
            location.href = `/play.html?roomId=${encodeURIComponent(code)}&game=${encodeURIComponent(game)}`;
        });

        el("btnRefreshRooms").onclick = () => loadRooms();

        el("btnOpenOverlay").onclick = () => {
            const code = roomId();
            if (!code) return alert("Pick a room first.");
            window.open(`/overlay.html?roomId=${encodeURIComponent(code)}`, "_blank");
        };

        el("btnStart").onclick = async () => {
            try {
                const code = roomId();
                if (!code) return alert("Pick a room first.");

                if (selectedGameId === "contexto") {
                    const secretWord = el("secretWord").value.trim();
                    const path = secretWord
                        ? `/rooms/${encodeURIComponent(code)}/games/contexto/start`
                        : `/rooms/${encodeURIComponent(code)}/games/contexto/next`;

                    const opts = secretWord
                        ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ secretWord }) }
                        : { method: "POST" };

                    const r = await api(path, opts);
                    el("gameOut").textContent = pretty(r);
                    await refreshState();
                    await refreshLeaderboard();
                    return;
                }

                el("gameOut").textContent = pretty({ ok: false, error: "Game not enabled yet" });
            } catch (e) {
                el("gameOut").textContent = String(e);
            }
        };

        el("btnStop").onclick = async () => {
            try {
                const code = roomId();
                if (!code) return alert("Pick a room first.");
                const r = await api(`/rooms/${encodeURIComponent(code)}/games/stop`, { method: "POST" });
                el("gameOut").textContent = pretty(r);
                await refreshState();
            } catch (e) {
                el("gameOut").textContent = String(e);
            }
        };

        el("btnLeaderboard").onclick = refreshLeaderboard;

        // Init
        async function init() {
            await el("btnMe").onclick();

            if (!myUserId) {
                location.href = "/user.html";
                return;
            }

            autoLoadRoomFromStorage();
            await loadRooms();
            startPolling();
        }

        init().catch(() => location.href = "/user.html");
    </script>
    <script>
        (function () {
            const btn = document.getElementById("settingsBtn");
            const overlay = document.getElementById("settingsOverlay");
            const panel = document.getElementById("settingsPanel");
            const closeBtn = document.getElementById("settingsCloseBtn");

            function openPanel() {
                panel.classList.add("open");
                overlay.hidden = false;
                panel.setAttribute("aria-hidden", "false");
                btn.setAttribute("aria-expanded", "true");
                // optional: focus first control
                const focusable = panel.querySelector("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])");
                if (focusable) focusable.focus();
                // optional: prevent background scroll
                document.documentElement.style.overflow = "hidden";
            }

            function closePanel() {
                panel.classList.remove("open");
                overlay.hidden = true;
                panel.setAttribute("aria-hidden", "true");
                btn.setAttribute("aria-expanded", "false");
                document.documentElement.style.overflow = "";
                btn.focus();
            }

            btn?.addEventListener("click", () => {
                const isOpen = panel.classList.contains("open");
                if (isOpen) closePanel();
                else openPanel();
            });

            overlay?.addEventListener("click", closePanel);
            closeBtn?.addEventListener("click", closePanel);

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && panel.classList.contains("open")) closePanel();
            });
        })();

        function wireLobbyButtons() {
            el("btnPlay").onclick = onPlayClicked;
            el("btnSettings").onclick = openSettingsPanel;

            // any other static controls go here
        }

        function selectGame(gameId) {
            selectedGameId = gameId;

            // highlight tile
            document.querySelectorAll(".game-tile")
                .forEach(t => t.classList.toggle(
                    "selected",
                    t.dataset.game === gameId
                ));

            // refresh control panel
            renderControlPanel(gameId);
        }

        tile.onclick = () => {
            if (item.enabled === false) return;
            selectGame(item.id);
        };

        function selectFirstEnabledGame() {
            const first = document.querySelector(".game-tile:not([aria-disabled])");
            if (first) selectGame(first.dataset.game);
        }

        function el(id) {
            const e = document.getElementById(id);
            if (!e) throw new Error(`Element #${id} not found`);
            return e;
        }

        document.addEventListener("DOMContentLoaded", () => {
            initLobby().catch(err => console.error("Lobby init failed", err));
        });
    </script>
</body>
</html>
