<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Misfitz Games – Lobby</title>
    <style>
        :root {
            --bg: #070A12;
            --card: rgba(255,255,255,.06);
            --text: #EAF0FF;
            --muted: rgba(234,240,255,.70);
            --accent: #7C3AED;
            --accent2: #06B6D4;
            --danger: #ef4444;
            --ok: #22c55e;
            --shadow: 0 10px 35px rgba(0,0,0,.55);
            --radius: 18px;
        }


        * {
            box-sizing: border-box
        }


        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
            color: var(--text);
            background: radial-gradient(1200px 700px at 20% 10%, rgba(124,58,237,.28), transparent 55%), radial-gradient(900px 700px at 80% 15%, rgba(6,182,212,.20), transparent 55%), var(--bg);
            min-height: 100vh;
        }


        .hero {
            position: relative;
            padding: 26px 18px 18px;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

            .hero::before {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(180deg, rgba(7,10,18,.18), rgba(7,10,18,.95)), url("/assets/bg.jpg") center/cover no-repeat;
                opacity: .85;
                transform: scale(1.03);
            }


        .wrap {
            position: relative;
            max-width: 1240px;
            margin: 0 auto;
        }


        .topbar {
            display: flex;
            gap: 14px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .brand img {
                width: 42px;
                height: 42px;
                border-radius: 12px;
                object-fit: cover;
                box-shadow: var(--shadow);
                background: rgba(255,255,255,.06);
                border: 1px solid rgba(255,255,255,.10);
            }

            .brand h1 {
                margin: 0;
                font-size: 18px;
            }

            .brand .tag {
                font-size: 12px;
                color: var(--muted);
                margin-top: 2px;
            }


        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 999px;
            background: rgba(255,255,255,.05);
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }


        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }


        input, select, button {
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.14);
            padding: 12px 12px;
            font-size: 14px;
            outline: none;
        }

        input, select {
            background: rgba(0,0,0,.25);
            color: var(--text);
            min-width: 200px;
        }

            input::placeholder {
                color: rgba(234,240,255,.45);
            }


        </html >
