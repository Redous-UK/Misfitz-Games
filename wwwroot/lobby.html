<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Misfitz Games – Lobby</title>
    <link rel="stylesheet" href="/site.css" />
</head>
<body>
    <section class="hero">
        <div class="wrap">
            <div class="topbar">
                <div class="brand">
                    <img src="/assets/logo.png" alt="Misfitz Games" />
                    <div>
                        <h1>Misfitz Games</h1>
                        <div class="tag">Lobby • pick a room • select a game</div>
                    </div>
                </div>

                <div class="row">
                    <span id="meLabel" class="pill">Checking login…</span>
                    <button id="btnAdmin" class="btn-secondary" style="display:none">Admin</button>
                    <button id="btnLogout" class="btn-secondary">Logout</button>
                    <button id="btnBack" class="btn-secondary">Back to Login</button>
                </div>
            </div>
        </div>
    </section>

    <div class="content">
        <div class="wrap">
            <div class="grid">

                <div class="card">
                    <h2>Room</h2>
                    <div class="row">
                        <button id="btnRefreshRooms" class="btn-secondary">Refresh rooms</button>
                        <button id="btnOpenOverlay" class="btn-secondary" disabled>Open overlay</button>
                        <span class="pill" id="activeRoomPill">Room: (none)</span>
                    </div>

                    <div id="roomsGrid" class="rooms-grid" style="margin-top:12px"></div>

                    <pre id="stateOut">{}</pre>
                </div>


                <div class="card">
                    <h2>Games</h2>
                    <div class="games" id="gamesGrid"></div>
                    <div class="muted" style="margin-top:10px; font-size:12px;">
                        Tip: Click a game tile to select it. “Start” uses the selected game.
                    </div>
                </div>


                <div class="card">
                    <h2>Players</h2>
                    <div class="player-list" id="playerList"></div>
                    <div class="muted" style="margin-top:10px; font-size:12px;">Tip: Players list updates automatically while a room is selected.</div>
                </div>

                <div class="card">
                    <h2>Account</h2>
                    <div class="row">
                        <button id="btnMe" class="btn-secondary">Check login</button>
                    </div>
                    <pre id="authOut">{}</pre>
                </div>

            </div>
        </div>
    </div>

    <!-- Floating settings button -->
    <button id="settingsBtn"
            class="settings-btn"
            aria-label="Open settings"
            aria-controls="settingsPanel"
            aria-expanded="false">
        ⚙️
    </button>

    <!-- Overlay (click to close) -->
    <div id="settingsOverlay" class="settings-overlay" hidden></div>

    <!-- Side panel -->
    <aside id="settingsPanel" class="settings-panel" aria-hidden="true" role="dialog" aria-label="Lobby settings">
        <div class="settings-header">
            <h2>Controls</h2>
            <button id="settingsCloseBtn" class="settings-close" aria-label="Close settings">✕</button>
        </div>

        <div class="settings-content">
            <!-- Move your existing lobby controls into here -->
            <!-- Example placeholders: -->
            <h2>Controls</h2>

            <div class="control-block">
                <label class="control-label" for="nameInput">Display name</label>
                <input id="username" class="control-input" />
            </div>

            <div id="controlPanelHost" class="settings-content"></div>
        </div>
    </aside>

    <script>
        const el = (id) => document.getElementById(id);

        function onClick(id, handler) {
            const node = el(id);
            if (!node) { console.warn(`[bind] missing #${id}`); return false; }
            node.addEventListener("click", handler);
            return true;
        }

        // ---- Drawer (Settings panel) ----
        function wireSettingsPanel() {
            const btn = el("settingsBtn");
            const overlay = el("settingsOverlay");
            const panel = el("settingsPanel");
            const closeBtn = el("settingsCloseBtn");

            // If the drawer isn't on this page/layout, just skip wiring.
            if (!btn || !overlay || !panel || !closeBtn) {
                console.warn("[drawer] missing elements", { btn, overlay, panel, closeBtn });
                return;
            }

            function openPanel() {
                panel.classList.add("open");
                overlay.hidden = false;
                panel.setAttribute("aria-hidden", "false");
                btn.setAttribute("aria-expanded", "true");
                document.documentElement.style.overflow = "hidden";
            }

            function closePanel() {
                panel.classList.remove("open");
                overlay.hidden = true;
                panel.setAttribute("aria-hidden", "true");
                btn.setAttribute("aria-expanded", "false");
                document.documentElement.style.overflow = "";
            }

            btn.addEventListener("click", () => {
                const isOpen = panel.classList.contains("open");
                if (isOpen) closePanel();
                else openPanel();
            });

            overlay.addEventListener("click", closePanel);
            closeBtn.addEventListener("click", closePanel);

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && panel.classList.contains("open")) closePanel();
            });

            // Optional: expose these if you want to open it from elsewhere
            window.openSettingsPanel = openPanel;
            window.closeSettingsPanel = closePanel;
        }

        const pretty = (x) => JSON.stringify(x, null, 2);

        let myUserId = null;
        let currentRoomState = null;

        async function api(path, opts = {}) {
            const res = await fetch(path, { credentials: "include", ...opts });
            const text = await res.text();
            let json; try { json = text ? JSON.parse(text) : null; } catch { json = { raw: text }; }
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${pretty(json)}`);
            return json;
        }

        async function refreshMe() {
            const me = await api("/member/me");

            el("authOut").textContent = pretty(me);
            el("meLabel").textContent = me.isAuth
                ? `👤 ${me.name ?? "Signed in"} (${me.role ?? "user"})`
                : "Not logged in";

            myUserId = me.userId || null;

            // show/hide admin button safely
            const btnAdmin = el("btnAdmin");
            if (btnAdmin) btnAdmin.style.display = (me.role === "admin") ? "" : "none";

            return me;
        }

        async function init() {
            let me;
            try {
                me = await refreshMe();
            } catch (e) {
                console.warn("refreshMe failed:", e);
                location.href = "/user.html";
                return;
            }

            // IMPORTANT: only redirect if genuinely not authed
            if (!me.isAuth || !myUserId) {
                location.href = "/user.html";
                return;
            }

            // continue normal lobby init
            // await loadRooms();
            // autoLoadRoomFromStorage();
            // startPolling();
        }

        // bind button safely
        onClick("btnMe", () => refreshMe().catch(e => console.warn("btnMe failed", e)));

        document.addEventListener("DOMContentLoaded", () => {
            init().catch(e => {
                console.error("Lobby init failed:", e);
                location.href = "/user.html";
            });
        });
    </script>

</body>
</html>
