<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Misfitz Games – User Admin</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #0b1020;
            color: #eaf0ff;
            padding: 20px;
        }

        h1 {
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,.15);
        }

        select, button {
            padding: 6px 10px;
        }

        .role-guest {
            color: #9ca3af;
        }

        .role-member {
            color: #22c55e;
        }

        .role-admin {
            color: #facc15;
            font-weight: 700;
        }

        pre {
            background: rgba(0,0,0,.4);
            padding: 10px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <h1>Misfitz Games – User Admin</h1>
    <p>This page is intentionally unsecured (bootstrap only).</p>

    <table id="userTable">
        <thead>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Change role</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

<pre id="out">{}</pre>

    <script>
        const out = document.getElementById("out");
        const tbody = document.querySelector("#userTable tbody");

        async function api(path, opts = {}) {
            const res = await fetch(path, {
                credentials: "include",
                ...opts
            });
            const text = await res.text();
            const json = text ? JSON.parse(text) : null;
            if (!res.ok) throw json;
            return json;
        }

        function roleClass(role) {
            return role === "admin" ? "role-admin"
                : role === "member" ? "role-member"
                    : "role-guest";
        }

        async function loadUsers() {
            const r = await api("/admin/users");
            tbody.innerHTML = "";

            for (const u of r.users) {
                const tr = document.createElement("tr");

                tr.innerHTML = `
          <td>${u.username}</td>
          <td class="${roleClass(u.role)}">${u.role}</td>
          <td>
            <select>
              <option value="guest">guest</option>
              <option value="member">member</option>
              <option value="admin">admin</option>
            </select>
          </td>
          <td>
            <button>Save</button>
          </td>
        `;

                const select = tr.querySelector("select");
                select.value = u.role;

                tr.querySelector("button").onclick = async () => {
                    try {
                        const role = select.value;
                        const res = await api(`/admin/users/${u.id}/role`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ role })
                        });
                        out.textContent = JSON.stringify(res, null, 2);
                        await loadUsers();
                    } catch (e) {
                        out.textContent = JSON.stringify(e, null, 2);
                    }
                };

                tbody.appendChild(tr);
            }
        }

        loadUsers().catch(e => out.textContent = JSON.stringify(e, null, 2));
    </script>

</body>
</html>
