<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Misfitz Games – Bootstrap Users</title>
    <link rel="stylesheet" href="/site.css" />
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>Bootstrap User Roles</h1>
            <div class="muted">
                This page does not use normal auth. It requires a <b>bootstrap key</b> and the server must have <b>ENABLE_BOOTSTRAP_ADMIN=true</b> (or be in Development).
                After you promote your admin user, disable the bootstrap endpoint.
            </div>

            <div class="row">
                <input id="key" placeholder="Bootstrap key (ADMIN_BOOTSTRAP_KEY)" />
                <button id="btnLoad">Load users</button>
                <button id="btnCopyLink" class="btn-secondary">Copy link with key</button>
            </div>

            <table id="tbl" style="display:none">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Role</th>
                        <th>Created</th>
                        <th>Last login</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>

            <pre id="out" class="debug-out">{}</pre>
        </div>
    </div>

    <script>
        const el = (id) => document.getElementById(id);
        const pretty = (x) => JSON.stringify(x, null, 2);

        // Allow key in URL: /admin-users.html?key=...
        const urlKey = new URLSearchParams(location.search).get("key");
        if (urlKey) el("key").value = urlKey;

        async function api(path, opts = {}) {
            const res = await fetch(path, opts);
            const text = await res.text();
            let json; try { json = text ? JSON.parse(text) : null; } catch { json = { raw: text }; }
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${pretty(json)}`);
            return json;
        }

        function fmt(d) {
            if (!d) return "";
            try { return new Date(d).toLocaleString(); } catch { return String(d); }
        }

        function rolePill(role) {
            const r = String(role || "guest").toLowerCase();
            const cls =
                r === "admin" ? "pill admin"
                    : r === "member" ? "pill member"
                        : "pill guest";
            return `<span class="${cls}">${r}</span>`;
        }

        function esc(s) {
            return String(s ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        async function loadUsers() {
            const key = el("key").value.trim();
            if (!key) return alert("Enter the bootstrap key first.");

            const data = await api(`/bootstrap/users?key=${encodeURIComponent(key)}`);
            el("out").textContent = pretty(data);

            const users = data.users || [];
            el("tbl").style.display = "";
            const tbody = el("tbody");
            tbody.innerHTML = users.map(u => `
            <tr>
              <td>${esc(u.username)}</td>
              <td>${rolePill(u.role)}</td>
              <td>${fmt(u.createdUtc)}</td>
              <td>${fmt(u.lastLoginUtc)}</td>
              <td>
                <div class="right">
                  <button data-act="makeAdmin" data-id="${u.id}">Make admin</button>
                  <button data-act="makeMember" class="btn-secondary" data-id="${u.id}">Make member</button>
                  <button data-act="makeGuest" class="btn-secondary" data-id="${u.id}">Make guest</button>
                </div>
              </td>
            </tr>
          `).join("");

            tbody.querySelectorAll("button[data-act]").forEach(btn => {
                btn.onclick = async () => {
                    const act = btn.getAttribute("data-act");
                    const id = btn.getAttribute("data-id");

                    // Map the button action -> role
                    const roleMap = {
                        makeAdmin: "admin",
                        makeMember: "member",
                        makeGuest: "guest"
                    };

                    const role = roleMap[act];
                    if (!role) return;

                    btn.disabled = true;

                    try {
                        const r = await api(
                            `/bootstrap/users/${encodeURIComponent(id)}/role?key=${encodeURIComponent(key)}`,
                            {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ role })
                            }
                        );

                        el("out").textContent = pretty(r);
                        await loadUsers();
                    } catch (e) {
                        el("out").textContent = String(e);
                    } finally {
                        btn.disabled = false;
                    }
                };
            });
        }

        el("btnLoad").onclick = () => loadUsers().catch(e => el("out").textContent = String(e));

        el("btnCopyLink").onclick = async () => {
            const key = el("key").value.trim();
            if (!key) return alert("Enter the bootstrap key first.");
            const url = `${location.origin}${location.pathname}?key=${encodeURIComponent(key)}`;
            await navigator.clipboard.writeText(url);
            alert("Link copied.");
        };
    </script>
</body>
</html>
